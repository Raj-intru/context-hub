# Local / self-hosted stack for Lyra.
# Secrets come from a .env file next to this compose file (see .env.example).
# Never commit a real .env.

services:
  db:
    image: postgres:16-alpine
    container_name: lyra_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyra_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lyra}
      # Consumed by db/zz-app-password.sh to provision the least-privileged app role.
      LYRA_APP_DB_PASSWORD: ${LYRA_APP_DB_PASSWORD:?set LYRA_APP_DB_PASSWORD in .env}
    volumes:
      - lyra_pgdata:/var/lib/postgresql/data
      # Init scripts run in alphabetical order on first boot only.
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/zz-app-password.sh:/docker-entrypoint-initdb.d/20-app-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyra_owner} -d ${POSTGRES_DB:-lyra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lyra_net]

  api:
    build: .
    container_name: lyra_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      # App connects as the least-privileged role so RLS is enforced.
      DATABASE_URL: postgres://lyra_app:${LYRA_APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-lyra}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CONTENT_ENCRYPTION_KEY: ${CONTENT_ENCRYPTION_KEY:?set CONTENT_ENCRYPTION_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODERATION_FAIL_OPEN: ${MODERATION_FAIL_OPEN:-false}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-google/gemini-flash-1.5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_QUOTAS: ${STRIPE_PRICE_QUOTAS:-{}}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Lyra <no-reply@example.com>}
      ENABLE_WEEKLY_DIGEST: ${ENABLE_WEEKLY_DIGEST:-false}
    networks: [lyra_net]

volumes:
  lyra_pgdata:

networks:
  lyra_net:
    driver: bridge
